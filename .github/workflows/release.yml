name: 📦 release

# kidager-bot creates the release PR and the releases, so release events start this workflow
on:
  release:
    types: [published]
  # Emergency path: deploy an existing tag again
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to deploy, e.g. v1.8.0
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      ARTIFACT_NAME: jacem-chaieb-me-${{ github.event.release.tag_name || inputs.tag }}
    outputs:
      artifact-name: ${{ env.ARTIFACT_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # Node 26 no longer ships yarn (nor corepack)
      - run: npm install -g yarn@1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .output
            .nuxt
          key: ${{ runner.os }}-nuxt-build-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-nuxt-build-
      - run: yarn install --frozen-lockfile
      - run: yarn run generate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload-artifact
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ./.output/public/
            firebase.json
            .firebaserc
          if-no-files-found: error
      - run: |
          curl -sSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "${{ env.ARTIFACT_NAME }}.zip" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/artifacts/${{ steps.upload-artifact.outputs.artifact-id }}/zip"
      - run: gh release upload "$TAG" "${{ env.ARTIFACT_NAME }}.zip" --clobber
        env:
          GH_TOKEN: ${{ github.TOKEN }}

  # Serves jacem.chaieb.me until the DNS moves to Cloudflare
  deploy-firebase:
    runs-on: ubuntu-26.04
    needs: build
    environment:
      name: production
      url: https://jacem.chaieb.me
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ./artifacts/firebase
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JACEM_CHAIEB }}
          projectId: jacem-chaieb
          channelId: live
          entryPoint: ./artifacts/firebase

  deploy-cloudflare:
    runs-on: ubuntu-26.04
    needs: build
    environment:
      name: cloudflare
      url: ${{ steps.deployment-cloudflare.outputs.deployment-url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ./artifacts/cloudflare
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        id: deployment-cloudflare
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./artifacts/cloudflare/.output/public --project-name=jacem-chaieb-me --branch=main --commit-hash=${{ github.sha }}

  build-github-pages:
    runs-on: ubuntu-26.04
    env:
      ARTIFACT_NAME: jacem-chaieb-me-${{ github.event.release.tag_name || inputs.tag }}-github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: npm install -g yarn@1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .output
            .nuxt
          key: ${{ runner.os }}-github-pages-nuxt-build-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-github-pages-nuxt-build-
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: |
          GITHUB_REPO_NAME="$(echo "${GITHUB_REPOSITORY}" | awk -F'/' '{print $2}')"
          echo "NUXT_APP_BASE_URL=/${GITHUB_REPO_NAME}/" >> "$GITHUB_ENV"
      - run: yarn install --frozen-lockfile
      - run: yarn run generate --preset github_pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        id: upload-artifact
        with:
          path: ./.output/public/
      - run: |
          curl -sSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "${{ env.ARTIFACT_NAME }}.zip" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/artifacts/${{ steps.upload-artifact.outputs.artifact_id }}/zip"
      - run: gh release upload "$TAG" "${{ env.ARTIFACT_NAME }}.zip" --clobber
        env:
          GH_TOKEN: ${{ github.TOKEN }}

  deploy-github-pages:
    runs-on: ubuntu-26.04
    needs: build-github-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment-github-pages.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment-github-pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
