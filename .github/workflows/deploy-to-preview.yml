name: 🔍 deploy-to-preview

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - '**docker**'
      - '.github/**'
      - '.gitignore'
      - '.vscode/**'
      - 'README.md'
      - 'justfile'
      - 'compose.yaml'

permissions:
  contents: read
  # For the kidager[bot] token that posts the comment
  id-token: write

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    # Deploy when:
    # - PR is labeled with 'deploy-preview' label
    # - PR is opened/synchronized/reopened by a user (not dependabot)
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'deploy-preview') ||
        (github.event.action != 'labeled' && github.actor != 'dependabot[bot]')
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # Node 26 no longer ships yarn (nor corepack)
      - run: npm install -g yarn@1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .output
            .nuxt
          key: ${{ runner.os }}-preview-nuxt-build-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-preview-nuxt-build-
      - run: yarn install --frozen-lockfile
      - run: yarn run generate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload-artifact
        with:
          name: preview-${{ github.run_id }}
          path: ./.output/public/
          if-no-files-found: error

  deploy-cloudflare:
    needs: build
    environment:
      name: preview-cloudflare
      url: ${{ steps.deployment-cloudflare.outputs.deployment-url }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-${{ github.run_id }}
          path: ./site
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        id: deployment-cloudflare
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./site --project-name=jacem-chaieb-me --branch=${{ github.head_ref || github.ref_name }} --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}
      - id: bot
        if: github.event_name == 'pull_request'
        uses: kidager/actions/token@51640e6ee365e87a4b78b555dcaf6a0c5183e8a9 # v1.0.0
      - name: Comment on PR with Cloudflare preview URL
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ steps.bot.outputs.token }}
          header: cloudflare-preview
          message: |
            ## ☁️ Cloudflare Pages Preview

            | Name | Link |
            | :--- | :--- |
            | **Preview URL** | ${{ steps.deployment-cloudflare.outputs.deployment-url }} |
            | **Branch alias** | ${{ steps.deployment-cloudflare.outputs.pages-deployment-alias-url }} |
